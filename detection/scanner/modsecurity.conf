SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off
SecAuditEngine Off
SecDebugLogLevel 0

# libmodsecurity를 웹 서버 connector 없이 직접 사용할 때는 JSON body processor를
# Content-Type에 따라 명시적으로 선택해야 한다. application/json뿐 아니라
# application/problem+json 같은 표준 structured syntax suffix도 함께 처리한다.
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/(?:[a-z0-9._-]+[+])?json(?:[[:space:]]*;|[[:space:]]*$)" \
    "id:200001,phase:1,pass,t:none,t:lowercase,nolog,ctl:requestBodyProcessor=JSON"

Include /opt/owasp-crs/crs-setup.conf
Include /opt/owasp-crs/rules/*.conf
