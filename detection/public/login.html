<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RUBY Detection 로그인</title>
  <style>
    :root { color-scheme:dark; --bg:#11161c; --surface:#171d24; --border:#46515d; --text:#dce2e8; --muted:#96a1ac; --blue:#315f7d; --red:#e0736b; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:20px; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(390px,100%); border:1px solid var(--border); background:var(--surface); box-shadow:0 18px 60px rgba(0,0,0,.35); }
    header { padding:20px; border-bottom:1px solid var(--border); }
    .label { margin:0 0 4px; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; }
    h1 { margin:0; font-size:19px; letter-spacing:0; }
    form { padding:20px; }
    label { display:block; margin-bottom:7px; color:var(--muted); font-size:12px; }
    input { width:100%; padding:10px; border:1px solid var(--border); background:#11161c; color:var(--text); font:inherit; }
    .actions { display:flex; justify-content:flex-end; margin-top:15px; }
    button { padding:9px 15px; border:1px solid var(--blue); background:var(--blue); color:#fff; font:inherit; cursor:pointer; }
    #error { min-height:21px; margin-top:8px; color:var(--red); font-size:12px; }
  </style>
</head>
<body>
  <main>
    <header><p class="label">RUBY Detection</p><h1>탐지 대시보드 로그인</h1></header>
    <form id="loginForm">
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus />
      <div id="error" role="alert"></div>
      <div class="actions"><button type="submit">로그인</button></div>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      const response = await fetch('/__detection/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:document.getElementById('password').value}),
      });
      if (response.ok) {
        window.location.replace('/__detection/dashboard');
        return;
      }
      const messages = {401:'비밀번호가 올바르지 않습니다.', 426:'HTTPS 연결에서만 로그인할 수 있습니다.', 429:'로그인 시도가 너무 많습니다. 잠시 후 다시 시도하세요.'};
      error.textContent = messages[response.status] || `로그인 실패 (HTTP ${response.status})`;
    });
  </script>
</body>
</html>
