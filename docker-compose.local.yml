name: ruby-local

services:
  detection:
    build: ./detection
    ports:
      - "8081:8081"
      - "127.0.0.1:18088:8080"
    environment:
      TARGET_URL: http://defense:8080
      TARGET_CHOICES: ${TARGET_CHOICES:-}
      TARGET_DEFAULT_ID: ${TARGET_DEFAULT_ID:-legacy}
      TARGET_SELECTION_FILE: /app/data/target-selection.json
      PUBLIC_TARGET_ORIGIN: http://127.0.0.1:8081
      LEGACY_TARGET_URL: http://host.docker.internal:${TARGET_PORT:-3000}
      PORT: "8081"
      ADMIN_PORT: "8080"
      BLOCK_MODE: "false"
      DETECTION_LEVEL: ${DETECTION_LEVEL:-medium}
      CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      SCHEMA_LEARNING_FILE: /app/data/schema-learning.json
      CRS_ENABLED: "true"
      CRS_MODE: ${CRS_MODE:-enforce}
      CRS_BLOCK_THRESHOLD: ${CRS_BLOCK_THRESHOLD:-5}
      CRS_SCAN_TIMEOUT_MS: "2000"
      CRS_MAX_BODY_BYTES: "1048576"
      DECEPTION_ENABLED: "true"
      DECEPTION_TOKEN_TTL_MS: "3600000"
      DECEPTION_MAX_SESSIONS: "5000"
      ENABLE_EXPERIMENT_RUN_ID: "true"
      PAYLOAD_FINGERPRINT_KEY: ${PAYLOAD_FINGERPRINT_KEY:-}
      DCID_HMAC_SECRET: ${DCID_HMAC_SECRET:-}
      DCID_TTL_MS: ${DCID_TTL_MS:-2592000000}
      DCID_COOKIE_SECURE: ${DCID_COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ACCOUNT_JWT_PUBLIC_KEY: ${ACCOUNT_JWT_PUBLIC_KEY:-}
      ACCOUNT_ID_HASH_KEY: ${ACCOUNT_ID_HASH_KEY:-}
      DETECTION_DASHBOARD_PASSWORD: ${DETECTION_DASHBOARD_PASSWORD:-}
      DETECTION_DASHBOARD_COOKIE_SECURE: "false"
      DETECTION_DASHBOARD_REQUIRE_HTTPS: "false"
      DETECTION_DASHBOARD_MAX_SESSIONS: ${DETECTION_DASHBOARD_MAX_SESSIONS:-1000}
      DETECTION_DASHBOARD_LOGIN_ATTEMPTS: ${DETECTION_DASHBOARD_LOGIN_ATTEMPTS:-5}
      DETECTION_DASHBOARD_LOGIN_WINDOW_SECONDS: ${DETECTION_DASHBOARD_LOGIN_WINDOW_SECONDS:-300}
      RESOLVED_ACTOR_TTL_MS: ${RESOLVED_ACTOR_TTL_MS:-604800000}
      MAX_RESOLVED_ACTORS: ${MAX_RESOLVED_ACTORS:-5000}
      MAX_RESOLUTION_MEMBERSHIPS: ${MAX_RESOLUTION_MEMBERSHIPS:-20000}
      MAX_RESOLUTION_RELATED_LINKS: ${MAX_RESOLUTION_RELATED_LINKS:-5}
      FINGERPRINT_SIMILARITY_TTL_MS: ${FINGERPRINT_SIMILARITY_TTL_MS:-1800000}
      FINGERPRINT_CLEANUP_INTERVAL_MS: ${FINGERPRINT_CLEANUP_INTERVAL_MS:-60000}
      FINGERPRINT_MAX_FLOW_CANDIDATES: ${FINGERPRINT_MAX_FLOW_CANDIDATES:-3}
      MAX_CLIENT_FLOWS: ${MAX_CLIENT_FLOWS:-5000}
      FINGERPRINT_IP_ROTATION_ENABLED: ${FINGERPRINT_IP_ROTATION_ENABLED:-true}
      DETECTION_ENTITY_TTL_MS: ${DETECTION_ENTITY_TTL_MS:-1800000}
      RISKY_ENTITY_TTL_MS: ${RISKY_ENTITY_TTL_MS:-86400000}
      DETECTION_ENTITY_SWEEP_MS: ${DETECTION_ENTITY_SWEEP_MS:-60000}
      MAX_SESSIONS: ${MAX_SESSIONS:-50000}
      MAX_ACTORS: ${MAX_ACTORS:-50000}
      MAX_AUTH_GROUPS: ${MAX_AUTH_GROUPS:-50000}
      MAX_IP_ENTRIES: ${MAX_IP_ENTRIES:-50000}
      XSS_MAX_BODY_BYTES: ${XSS_MAX_BODY_BYTES:-2000000}
      XSS_CANDIDATE_TTL_MS: ${XSS_CANDIDATE_TTL_MS:-3600000}
      XSS_MAX_CANDIDATES: ${XSS_MAX_CANDIDATES:-2000}
      XSS_MAX_CANDIDATE_BYTES: ${XSS_MAX_CANDIDATE_BYTES:-4194304}
      XSS_MAX_VALUE_BYTES: ${XSS_MAX_VALUE_BYTES:-4096}
    volumes:
      - detection-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      defense:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-defense-net

  defense:
    build: ./defense
    environment:
      TARGET_HOST: host.docker.internal
      TARGET_PORT: ${TARGET_PORT:-3000}
      TARGET_CHOICES: ${TARGET_CHOICES:-}
      TARGET_DEFAULT_ID: ${TARGET_DEFAULT_ID:-legacy}
      TARGET_SELECTION_FILE: /app/target-data/target-selection.json
      TOKEN_GATE_MODE: ${TOKEN_GATE_MODE:-observe}
      TOKEN_GATE_SECRET: ${TOKEN_GATE_SECRET:-}
      TOKEN_GATE_EPOCH_S: ${TOKEN_GATE_EPOCH_S:-300}
      TOKEN_GATE_GRACE_EPOCHS: ${TOKEN_GATE_GRACE_EPOCHS:-1}
      TOKEN_GATE_EXEMPT_PREFIXES: ${TOKEN_GATE_EXEMPT_PREFIXES:-/healthz,/__defense/,/__detection/}
      TOKEN_GATE_COOKIE_SECURE: ${TOKEN_GATE_COOKIE_SECURE:-false}
      PATH_ALIAS_MODE: ${PATH_ALIAS_MODE:-off}
      PATH_ALIAS_EPOCH_S: ${PATH_ALIAS_EPOCH_S:-1800}
      PATH_ALIAS_GRACE_EPOCHS: ${PATH_ALIAS_GRACE_EPOCHS:-1}
      PATH_ALIAS_PREFIXES: ${PATH_ALIAS_PREFIXES:-/rest/,/api/,/b2b/}
      PATH_ALIAS_ROUTES_FILE: ${PATH_ALIAS_ROUTES_FILE:-/app/config/juice-shop-routes.json}
      # Local runs select the target "legacy"; set legacy here when it serves the route file's app.
      PATH_ALIAS_TARGET_IDS: ${PATH_ALIAS_TARGET_IDS:-}
      # Default alias table: one SQLite file (WAL) on a named volume.
      PATH_ALIAS_DB_PATH: /app/alias-data/path-alias.sqlite3
      PATH_ALIAS_MAX_REWRITE_BYTES: ${PATH_ALIAS_MAX_REWRITE_BYTES:-8388608}
      PATH_ALIAS_APP_ID: ${PATH_ALIAS_APP_ID:-}
      PATH_ALIAS_ROTATE_ON: ${PATH_ALIAS_ROTATE_ON:-direct,malformed_alias,foreign_alias}
      PATH_ALIAS_ROTATE_MIN_INTERVAL_S: ${PATH_ALIAS_ROTATE_MIN_INTERVAL_S:-5}
      PATH_ALIAS_PENDING_TTL_S: ${PATH_ALIAS_PENDING_TTL_S:-300}
      PATH_ALIAS_MAX_PENDING_CLIENTS: ${PATH_ALIAS_MAX_PENDING_CLIENTS:-10000}
      PATH_ALIAS_MAX_CLIENTS: ${PATH_ALIAS_MAX_CLIENTS:-100000}
      PATH_ALIAS_STALE_REDIRECT: ${PATH_ALIAS_STALE_REDIRECT:-true}
      PATH_ALIAS_STALE_REDIRECT_UNSAFE: ${PATH_ALIAS_STALE_REDIRECT_UNSAFE:-false}
      PATH_ALIAS_TOMBSTONE_S: ${PATH_ALIAS_TOMBSTONE_S:-21600}
      PATH_ALIAS_COOKIE_SECURE: ${PATH_ALIAS_COOKIE_SECURE:-false}
      DEFENSE_DASHBOARD_ENABLED: ${DEFENSE_DASHBOARD_ENABLED:-true}
      DECOY_UPSTREAM_CHOICES: legacy=http://cheat-legacy:3012,alternate=http://cheat-alternate:3012
      OVERLAY_UPSTREAM_CHOICES: legacy=http://overlay-legacy:8080,alternate=http://overlay-alternate:8080
      OVERLAY_DETECTOR_KEY: ${OVERLAY_DETECTOR_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      DEFENSE_OVERLAY_STATE_DB: /app/overlay-state/routes.sqlite3
      DEFENSE_DASHBOARD_PASSWORD: ${DEFENSE_DASHBOARD_PASSWORD:-}
      DEFENSE_DASHBOARD_COOKIE_SECURE: ${DEFENSE_DASHBOARD_COOKIE_SECURE:-false}
      DEFENSE_DASHBOARD_REQUIRE_HTTPS: "false"
      DEFENSE_EVENT_LIMIT: ${DEFENSE_EVENT_LIMIT:-5000}
      DEFENSE_DASHBOARD_MAX_SESSIONS: ${DEFENSE_DASHBOARD_MAX_SESSIONS:-1000}
      DEFENSE_DASHBOARD_LOGIN_ATTEMPTS: ${DEFENSE_DASHBOARD_LOGIN_ATTEMPTS:-5}
      DEFENSE_DASHBOARD_LOGIN_WINDOW_SECONDS: ${DEFENSE_DASHBOARD_LOGIN_WINDOW_SECONDS:-300}
    volumes:
      - ./defense/app:/app/app
      - ./defense/config:/app/config:ro
      - detection-data:/app/target-data:ro
      - defense-overlay-data:/app/overlay-state
      - defense-alias-data:/app/alias-data
    depends_on:
      cheat-legacy:
        condition: service_healthy
      cheat-alternate:
        condition: service_healthy
      overlay-legacy:
        condition: service_healthy
      overlay-alternate:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --no-proxy-headers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 2s
      timeout: 3s
      retries: 15
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-defense-net

  cheat-legacy:
    build: ./defense/CHeat-defense-proxy/defense_proxy_v2
    environment:
      REAL_BACKEND: http://host.docker.internal:${TARGET_PORT:-3000}
      TARGET_PRESET: apache-php
      DEFENSE_MODE: "off"
      DECOY_REQUIRE_PLAN: "1"
      CLIENT_ID_FALLBACK: ip
      DEFENSE_DB: /tmp/defense.db
      UVICORN_PROXY_HEADERS: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 3012), 2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 15
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-defense-net

  cheat-alternate:
    build: ./defense/CHeat-defense-proxy/defense_proxy_v2
    environment:
      REAL_BACKEND: http://host.docker.internal:${TARGET_PORT:-3000}
      TARGET_PRESET: apache-php
      DEFENSE_MODE: "off"
      DECOY_REQUIRE_PLAN: "1"
      CLIENT_ID_FALLBACK: ip
      DEFENSE_DB: /tmp/defense.db
      UVICORN_PROXY_HEADERS: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 3012), 2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 15
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-defense-net

  overlay-legacy:
    build: ./defense/account-response-overlay
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      OVERLAY_CONFIG: /app/config/overlay-production-juice-v2.toml
      OVERLAY_ORIGIN_URL: http://host.docker.internal:${TARGET_PORT:-3000}
      OVERLAY_DETECTOR_KEY: ${OVERLAY_DETECTOR_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      DEFENSE_SECRET_FILE: /app/state/session.key
      DEFENSE_DETECTOR_SECRET_FILE: /app/state/detector.key
      DEFENSE_SECURITY_DB: /app/state/security.sqlite3
    volumes:
      - overlay-legacy-data:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), 2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 15
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-defense-net

  overlay-alternate:
    build: ./defense/account-response-overlay
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      OVERLAY_CONFIG: /app/config/overlay-production-ruby-v2.toml
      OVERLAY_ORIGIN_URL: http://host.docker.internal:${TARGET_PORT:-3000}
      OVERLAY_DETECTOR_KEY: ${OVERLAY_DETECTOR_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      DEFENSE_SECRET_FILE: /app/state/session.key
      DEFENSE_DETECTOR_SECRET_FILE: /app/state/detector.key
      DEFENSE_SECURITY_DB: /app/state/security.sqlite3
    volumes:
      - overlay-alternate-data:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), 2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 15
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-defense-net

networks:
  ai-defense-net:

volumes:
  detection-data:
  defense-alias-data:
  defense-overlay-data:
  overlay-legacy-data:
  overlay-alternate-data:
