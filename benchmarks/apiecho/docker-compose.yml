services:
  target:
    build:
      context: ./target/fastapi-app
    container_name: apiecho-target
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
