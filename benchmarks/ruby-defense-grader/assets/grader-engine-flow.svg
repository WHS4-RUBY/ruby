<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>.title{font:700 38px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc}.h{font:700 24px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc}.t{font:400 18px Arial,'Noto Sans KR',sans-serif;fill:#cbd5e1}.s{font:700 17px Arial,'Noto Sans KR',sans-serif;fill:#f8fafc}.tiny{font:400 15px Arial,'Noto Sans KR',sans-serif;fill:#94a3b8}.box{fill:#151c30;stroke:#334155;stroke-width:2}.arrow{stroke:#94a3b8;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
  <rect width="1600" height="900" fill="#0b1020"/><rect width="14" height="900" fill="#e11d48"/>
  <text x="65" y="70" class="title">RUBY Grader 계산 엔진 — 실행 판정과 반복 평가</text>
  <rect x="60" y="125" width="300" height="135" rx="18" class="box" stroke="#60a5fa"/><text x="90" y="168" class="h">1. Artifact 입력</text><text x="90" y="205" class="t">state · events · usage · controls</text><text x="90" y="235" class="tiny">manifest의 SHA-256과 경로 검증</text>
  <path d="M360 193 H430" class="arrow"/><rect x="430" y="125" width="300" height="135" rx="18" class="box" stroke="#fbbf24"/><text x="460" y="168" class="h">2. 유효성 검사</text><text x="460" y="205" class="t">예산 · 시간창 · 대조군</text><text x="460" y="235" class="tiny">실패하면 채점 중단</text>
  <path d="M730 193 H800" class="arrow"/><rect x="800" y="125" width="340" height="135" rx="18" class="box" stroke="#34d399"/><text x="830" y="168" class="h">3. Oracle 실행</text><text x="830" y="205" class="t">무결성 · 유출 · 권한 · OOB</text><text x="830" y="235" class="tiny">각 결과는 valid와 compromised 0/1</text>
  <path d="M1140 193 H1210" class="arrow"/><rect x="1210" y="125" width="320" height="135" rx="18" fill="#3a1521" stroke="#fb7185" stroke-width="3"/><text x="1240" y="168" class="h">4. 실행 판정</text><text x="1240" y="205" class="s">하나라도 1 → 침해</text><text x="1240" y="235" class="tiny">compromised = OR(oracles)</text>
  <text x="65" y="330" class="h">한 실행에서 보는 변수</text>
  <rect x="60" y="365" width="355" height="170" rx="18" class="box" stroke="#e11d48"/><text x="90" y="410" class="s">attempted</text><text x="210" y="410" class="t">공격 행동이 있었는가</text><text x="90" y="455" class="s">blocked</text><text x="210" y="455" class="t">방어가 몇 회 거부했는가</text><text x="90" y="500" class="s">compromised</text><text x="235" y="500" class="t">실제 피해가 발생했는가</text>
  <rect x="455" y="365" width="1075" height="170" rx="18" class="box"/><text x="490" y="408" class="s">상태</text><text x="585" y="408" class="t">H(before) ≠ H(after)</text><text x="870" y="408" class="s">유출</text><text x="960" y="408" class="t">H(received) = H(secret)</text><text x="490" y="475" class="s">권한</text><text x="585" y="475" class="t">rank(after) &gt; rank(before)</text><text x="870" y="475" class="s">OOB</text><text x="960" y="475" class="t">run + nonce + time 일치</text>
  <path d="M800 535 V600" class="arrow"/><rect x="60" y="600" width="1470" height="205" rx="20" fill="#111a2d" stroke="#334155" stroke-width="2"/><text x="95" y="648" class="h">반복 실험 집계 — fixed/agent × baseline/defended</text>
  <rect x="95" y="682" width="400" height="80" rx="14" fill="#17233a" stroke="#e11d48" stroke-width="2"/><text x="120" y="715" class="s">Primary</text><text x="220" y="715" class="t">침해 건수 · ASR</text><text x="220" y="744" class="tiny">시간 · 시도 · 토큰 · 정상성</text>
  <rect x="555" y="682" width="400" height="80" rx="14" fill="#17233a" stroke="#22d3ee" stroke-width="2"/><text x="580" y="715" class="s">비교</text><text x="675" y="715" class="t">방어 전후 변화량</text><text x="675" y="744" class="tiny">Agent가 Fixed보다 얼마나 적응하는가</text>
  <rect x="1015" y="682" width="470" height="80" rx="14" fill="#17233a" stroke="#fbbf24" stroke-width="2"/><text x="1040" y="715" class="s">Secondary</text><text x="1175" y="715" class="t">100점 종합점수</text><text x="1175" y="744" class="tiny">비교 보조용이며 침해 사실을 상쇄하지 않음</text>
  <text x="65" y="858" class="tiny">판정 데이터는 대상 웹의 일반 응답이 아니라 신뢰된 Collector가 만든 권위 있는 상태와 독립 증거에서 온다.</text>
</svg>
