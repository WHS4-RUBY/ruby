[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruby-defense-grader"
version = "0.3.0"
description = "A reproducible grader for resistance against adaptive LLM attacks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ruby-grader = "ruby_grader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
