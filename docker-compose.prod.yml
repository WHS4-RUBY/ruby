networks:
  ai-defense-net:
    external: true

services:
  detection:
    container_name: detection
    image: ${IMAGE_PREFIX}/detection:${IMAGE_TAG:-latest}
    ports:
      - "80:8081"
    environment:
      - NEXT_HOP_URL=http://policy:8082
    depends_on:
      - policy
    restart: unless-stopped
    networks:
      - ai-defense-net

  policy:
    container_name: policy
    image: ${IMAGE_PREFIX}/policy:${IMAGE_TAG:-latest}
    ports:
      - "8082:8082"
    environment:
      - NEXT_HOP_URL=http://defense:8080
    depends_on:
      - defense
    restart: unless-stopped
    networks:
      - ai-defense-net

  defense:
    container_name: defense
    image: ${IMAGE_PREFIX}/defense:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - BENCHMARK_TARGET_URL=${BENCHMARK_TARGET_URL:-http://benchmark-target:3000}
    depends_on:
      benchmark-target:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-defense-net

  benchmark-target:
    profiles:
      - ${BENCHMARK_PROFILE:-disabled}
    image: ${BENCHMARK_IMAGE:?Set BENCHMARK_IMAGE in benchmark/config.env}
    expose:
      - "${BENCHMARK_TARGET_PORT:-3000}"
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          require('net').connect({port: process.env.BENCHMARK_TARGET_PORT || 3000,
          host: '127.0.0.1'}).on('connect', () => process.exit(0)).on('error', () => process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    environment:
      - BENCHMARK_TARGET_PORT=${BENCHMARK_TARGET_PORT:-3000}
      - PORT=${BENCHMARK_TARGET_PORT:-3000}
    restart: unless-stopped
    networks:
      - ai-defense-net
