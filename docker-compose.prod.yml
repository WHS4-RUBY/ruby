services:
  detection:
    container_name: detection
    image: ${IMAGE_PREFIX}/detection:${IMAGE_TAG:-latest}
    ports:
      - "80:8081"
    environment:
      - NEXT_HOP_URL=http://policy:8082
    depends_on:
      - policy
    restart: unless-stopped

  policy:
    container_name: policy
    image: ${IMAGE_PREFIX}/policy:${IMAGE_TAG:-latest}
    ports:
      - "8082:8082"
    environment:
      - NEXT_HOP_URL=http://defense:8080
    depends_on:
      - defense
    restart: unless-stopped

  defense:
    container_name: defense
    image: ${IMAGE_PREFIX}/defense:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - BENCHMARK_TARGET_URL=http://benchmark-target:${BENCHMARK_TARGET_PORT:-3000}
    depends_on:
      benchmark-target:
        condition: service_healthy
    restart: unless-stopped
  
  benchmark-target:
    image: bkimminich/juice-shop:latest
    expose:
      - "${BENCHMARK_TARGET_PORT:-3000}"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --no-verbose --tries=1 --spider http://127.0.0.1:${BENCHMARK_TARGET_PORT:-3000}/ || exit 1"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      - BENCHMARK_TARGET_PORT=${BENCHMARK_TARGET_PORT:-3000}
      - PORT=${BENCHMARK_TARGET_PORT:-3000}
    restart: unless-stopped
