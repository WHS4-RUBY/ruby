name: 버그 신고
description: 재현 가능한 오류나 예상과 다른 동작을 신고합니다.
title: "[Bug] "
labels: ["bug"]
assignees: ["Opal1031"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영향 영역
      options:
        - Benchmark
        - Defense
        - Detection
        - 공통 설정 또는 통합 실행
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 실제 동작과 오류 메시지를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있는 최소한의 절차와 명령을 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 정상적으로 기대한 결과를 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, Docker 이미지, 런타임과 주요 도구 버전을 작성해 주세요.
  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 이슈에 같은 문제가 없는지 확인했습니다.
          required: true
        - label: 로그와 예시에서 비밀 정보 및 개인정보를 제거했습니다.
          required: true
