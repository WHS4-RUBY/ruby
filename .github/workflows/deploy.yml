name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: detection
            context: ./detection
          - service: defense
            context: ./defense
          - service: decoy-sidecar
            context: ./defense/CHeat-defense-proxy/defense_proxy_v2
          - service: account-response-overlay
            context: ./defense/account-response-overlay
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Prepare candidate compose file
        run: cp docker-compose.yml docker-compose.candidate.yml

      - name: Copy candidate compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.candidate.yml
          target: ~/ruby

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          DEFENSE_DASHBOARD_PASSWORD: ${{ secrets.DEFENSE_DASHBOARD_PASSWORD }}
          DETECTION_DASHBOARD_PASSWORD: ${{ secrets.DEFENSE_DASHBOARD_PASSWORD }}
          # This server currently exposes port 80 without a TLS proxy. Keep HTTP mode explicit.
          ALLOW_INSECURE_DASHBOARD_HTTP: "true"
          DEFENSE_DASHBOARD_COOKIE_SECURE: "false"
          DEFENSE_DASHBOARD_REQUIRE_HTTPS: "false"
          DETECTION_DASHBOARD_COOKIE_SECURE: "false"
          DETECTION_DASHBOARD_REQUIRE_HTTPS: "false"
          DCID_COOKIE_SECURE: "false"
          PAYLOAD_FINGERPRINT_KEY: ${{ secrets.PAYLOAD_FINGERPRINT_KEY }}
          DCID_HMAC_SECRET: ${{ secrets.DCID_HMAC_SECRET }}
          ACCOUNT_ID_HASH_KEY: ${{ secrets.ACCOUNT_ID_HASH_KEY }}
          # Not used by the current compose file (the alias table is SQLite). Still passed when
          # the secret exists so a rollback to a compose file from before the switch can start.
          TRUST_PROXY: loopback,linklocal,uniquelocal
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_PREFIX,IMAGE_TAG,DEFENSE_DASHBOARD_PASSWORD,DETECTION_DASHBOARD_PASSWORD,ALLOW_INSECURE_DASHBOARD_HTTP,DEFENSE_DASHBOARD_COOKIE_SECURE,DEFENSE_DASHBOARD_REQUIRE_HTTPS,DETECTION_DASHBOARD_COOKIE_SECURE,DETECTION_DASHBOARD_REQUIRE_HTTPS,DCID_COOKIE_SECURE,PAYLOAD_FINGERPRINT_KEY,DCID_HMAC_SECRET,ACCOUNT_ID_HASH_KEY,TRUST_PROXY
          script: |
            set -Eeuo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/ruby}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            for name in DEFENSE_DASHBOARD_PASSWORD DETECTION_DASHBOARD_PASSWORD PAYLOAD_FINGERPRINT_KEY DCID_HMAC_SECRET ACCOUNT_ID_HASH_KEY; do
              if [ -z "${!name:-}" ]; then
                echo "Required deployment secret is missing: $name" >&2
                exit 1
              fi
            done

            # Reuse the existing deployment secret only as key material. The
            # overlay receives a distinct, domain-separated detector key.
            OVERLAY_DETECTOR_KEY="$(python3 -c 'import hashlib,hmac,os; print(hmac.new(os.environ["DCID_HMAC_SECRET"].encode(), b"ruby:account-overlay:detector:v1", hashlib.sha256).hexdigest())')"
            export OVERLAY_DETECTOR_KEY
            export IMAGE_PREFIX IMAGE_TAG
            PREVIOUS_TAG="$(cat .deployed-image-tag 2>/dev/null || true)"
            rollback() {
              trap - ERR
              if [ -n "$PREVIOUS_TAG" ] && [ -f docker-compose.yml ]; then
                echo "Deployment failed; rolling back to $PREVIOUS_TAG" >&2
                export IMAGE_TAG="$PREVIOUS_TAG"
                docker compose -f docker-compose.yml up -d --remove-orphans --wait --wait-timeout 120
              fi
            }
            trap rollback ERR

            docker compose -f docker-compose.candidate.yml pull
            docker compose -f docker-compose.candidate.yml up -d --wait --wait-timeout 120

            # Verify both target-specific overlays with a private signed GET.
            # This does not change the selected public target or expose a port.
            docker compose -f docker-compose.candidate.yml exec -T defense python - <<'PY'
            import asyncio
            import os
            import httpx
            from app.overlay_routing import signed_headers

            async def main():
                secret = os.environ['OVERLAY_DETECTOR_KEY'].encode('utf-8')
                async with httpx.AsyncClient(timeout=10, trust_env=False) as client:
                    for target, origin in (
                        ('juice', 'http://overlay-juice:8080'),
                        ('ruby', 'http://overlay-ruby:8080'),
                    ):
                        headers = signed_headers(secret, f'deploy-smoke-{target}', 'GET', '/', b'', tier='medium')
                        response = await client.get(origin + '/', headers=headers)
                        if response.status_code != 200 or '/assets/account-recovery.js' not in response.text:
                            raise SystemExit(f'{target} account overlay smoke failed: {response.status_code}')

            asyncio.run(main())
            PY

            DETECTION_COOKIES="$(mktemp)"
            DEFENSE_COOKIES="$(mktemp)"
            trap 'rm -f "$DETECTION_COOKIES" "$DEFENSE_COOKIES"' EXIT
            curl --fail --silent --show-error http://127.0.0.1/healthz >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/__detection/api/sessions)" = "404"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/)" = "404"
            curl --fail --silent --show-error -c "$DETECTION_COOKIES" \
              -H 'Content-Type: application/json' \
              --data "$(printf '{"password":"%s"}' "$DETECTION_DASHBOARD_PASSWORD")" \
              http://127.0.0.1:8088/__detection/api/login >/dev/null
            curl --fail --silent --show-error -b "$DETECTION_COOKIES" \
              http://127.0.0.1:8088/__detection/api/sessions >/dev/null
            curl --fail --silent --show-error -b "$DETECTION_COOKIES" \
              http://127.0.0.1:8088/__detection/api/target-selection >/dev/null
            curl --fail --silent --show-error -c "$DEFENSE_COOKIES" \
              -H 'Content-Type: application/json' \
              --data "$(printf '{"password":"%s"}' "$DEFENSE_DASHBOARD_PASSWORD")" \
              http://127.0.0.1:8088/__defense/api/login >/dev/null
            curl --fail --silent --show-error -b "$DEFENSE_COOKIES" \
              http://127.0.0.1:8088/__defense/api/snapshot >/dev/null
            curl --fail --silent --show-error http://127.0.0.1/ >/dev/null

            mv -f docker-compose.candidate.yml docker-compose.yml
            printf '%s\n' "$IMAGE_TAG" > .deployed-image-tag
            trap - ERR
