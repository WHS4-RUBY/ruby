name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [detection, defense]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Copy compose files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.target.juice-shop.yml,docker-compose.target.ruby-web.yml,docker-compose.target.site.yml,gateway/default.conf.template,gateway/render-config.sh,target-profiles/ruby-market.json,benchmark/benchmarks/web-defense-benchmark/app/compose.production.yaml,benchmark/benchmarks/web-defense-benchmark/app/.env.production.example"
          target: ~/ruby

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          DEFENSE_DASHBOARD_PASSWORD: ${{ secrets.DEFENSE_DASHBOARD_PASSWORD }}
          DETECTION_DASHBOARD_PASSWORD: ${{ secrets.DEFENSE_DASHBOARD_PASSWORD }}
          # This server currently exposes port 80 without a TLS proxy. Keep HTTP mode explicit.
          ALLOW_INSECURE_DASHBOARD_HTTP: "true"
          DEFENSE_DASHBOARD_COOKIE_SECURE: "false"
          DEFENSE_DASHBOARD_REQUIRE_HTTPS: "false"
          DETECTION_DASHBOARD_COOKIE_SECURE: "false"
          DETECTION_DASHBOARD_REQUIRE_HTTPS: "false"
          DCID_COOKIE_SECURE: "false"
          PAYLOAD_FINGERPRINT_KEY: ${{ secrets.PAYLOAD_FINGERPRINT_KEY }}
          DCID_HMAC_SECRET: ${{ secrets.DCID_HMAC_SECRET }}
          ACCOUNT_ID_HASH_KEY: ${{ secrets.ACCOUNT_ID_HASH_KEY }}
          TRUST_PROXY: loopback,linklocal,uniquelocal
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_PREFIX,IMAGE_TAG,DEFENSE_DASHBOARD_PASSWORD,DETECTION_DASHBOARD_PASSWORD,ALLOW_INSECURE_DASHBOARD_HTTP,DEFENSE_DASHBOARD_COOKIE_SECURE,DEFENSE_DASHBOARD_REQUIRE_HTTPS,DETECTION_DASHBOARD_COOKIE_SECURE,DETECTION_DASHBOARD_REQUIRE_HTTPS,DCID_COOKIE_SECURE,PAYLOAD_FINGERPRINT_KEY,DCID_HMAC_SECRET,ACCOUNT_ID_HASH_KEY,TRUST_PROXY
          script: |
            set -Eeuo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/ruby}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            for name in DEFENSE_DASHBOARD_PASSWORD DETECTION_DASHBOARD_PASSWORD PAYLOAD_FINGERPRINT_KEY DCID_HMAC_SECRET ACCOUNT_ID_HASH_KEY; do
              if [ -z "${!name:-}" ]; then
                echo "Required deployment secret is missing: $name" >&2
                exit 1
              fi
            done

            export IMAGE_PREFIX IMAGE_TAG
            PREVIOUS_TAG="$(cat .deployed-image-tag 2>/dev/null || true)"
            DETECTION_COOKIES=""
            DEFENSE_COOKIES=""
            GATEWAY_CONFIG_BACKUP="$(mktemp)"
            GATEWAY_UPDATE_STARTED=false
            cleanup() {
              for path in "$DETECTION_COOKIES" "$DEFENSE_COOKIES" "$GATEWAY_CONFIG_BACKUP"; do
                if [ -n "$path" ]; then rm -f "$path"; fi
              done
            }
            trap cleanup EXIT
            # The copied template may already differ from the config serving traffic.
            # Preserve the running config so a failed rollout can restore it.
            if ! docker compose -f docker-compose.yml exec -T gateway cat /etc/nginx/conf.d/default.conf > "$GATEWAY_CONFIG_BACKUP" 2>/dev/null || [ ! -s "$GATEWAY_CONFIG_BACKUP" ]; then
              rm -f "$GATEWAY_CONFIG_BACKUP"
              GATEWAY_CONFIG_BACKUP=""
            fi
            rollback() {
              trap - ERR
              if [ "$GATEWAY_UPDATE_STARTED" != true ]; then return; fi
              if [ -n "$GATEWAY_CONFIG_BACKUP" ]; then
                cp "$GATEWAY_CONFIG_BACKUP" gateway/default.conf.template
              fi
              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$IMAGE_TAG" ]; then
                echo "Deployment failed; rolling back to $PREVIOUS_TAG" >&2
                export IMAGE_TAG="$PREVIOUS_TAG"
              fi
              if [ -n "$GATEWAY_CONFIG_BACKUP" ]; then
                docker compose -f docker-compose.yml up -d --no-deps --force-recreate gateway
              fi
              docker compose -f docker-compose.yml up -d --wait --wait-timeout 120
            }
            trap rollback ERR

            docker compose -f docker-compose.yml pull
            GATEWAY_UPDATE_STARTED=true
            docker compose -f docker-compose.yml up -d --wait --wait-timeout 120
            # The gateway renders its bind-mounted template only at startup.
            # Compose does not recreate it when the mounted file contents change.
            docker compose -f docker-compose.yml up -d --no-deps --force-recreate --wait --wait-timeout 120 gateway

            DETECTION_COOKIES="$(mktemp)"
            DEFENSE_COOKIES="$(mktemp)"
            curl --fail --silent --show-error http://127.0.0.1/healthz >/dev/null
            test "$(curl --fail --silent --show-error http://127.0.0.1/__ruby/target)" = '{"publicPath":"/juice-shop/"}'
            test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' http://127.0.0.1/)" = "http://127.0.0.1/juice-shop/"
            curl --fail --silent --show-error http://127.0.0.1/juice-shop/ >/dev/null
            curl --fail --silent --show-error 'http://127.0.0.1/rest/products/search?q=' >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/ruby-market/)" = "404"
            curl --fail --silent --show-error -c "$DETECTION_COOKIES" \
              -H 'Content-Type: application/json' \
              --data "$(printf '{"password":"%s"}' "$DETECTION_DASHBOARD_PASSWORD")" \
              http://127.0.0.1/__detection/api/login >/dev/null
            curl --fail --silent --show-error -b "$DETECTION_COOKIES" \
              http://127.0.0.1/__detection/api/sessions >/dev/null
            curl --fail --silent --show-error -c "$DEFENSE_COOKIES" \
              -H 'Content-Type: application/json' \
              --data "$(printf '{"password":"%s"}' "$DEFENSE_DASHBOARD_PASSWORD")" \
              http://127.0.0.1/__defense/api/login >/dev/null
            curl --fail --silent --show-error -b "$DEFENSE_COOKIES" \
              http://127.0.0.1/__defense/api/snapshot >/dev/null
            curl --fail --silent --show-error http://127.0.0.1/juice-shop/ >/dev/null

            printf '%s\n' "$IMAGE_TAG" > .deployed-image-tag
            trap - ERR
