name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  detection-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: detection/package-lock.json

      - name: Install Detection dependencies
        working-directory: detection
        run: npm ci

      - name: Test Detection
        working-directory: detection
        run: npm test

      - name: Audit Detection dependencies
        working-directory: detection
        run: npm audit --audit-level=moderate

      - name: Build Detection image
        run: docker build -t detection:ci ./detection

      - name: Validate Detection, Defense, and selectable target contract
        env:
          IMAGE_PREFIX: ghcr.io/whs4-ruby/ruby
          PAYLOAD_FINGERPRINT_KEY: compose-validation-key
          DCID_HMAC_SECRET: compose-validation-dcid-key
          ACCOUNT_ID_HASH_KEY: compose-validation-account-key
          DETECTION_DASHBOARD_PASSWORD: compose-validation-detection-password
          DEFENSE_DASHBOARD_PASSWORD: compose-validation-defense-password
          DCID_COOKIE_SECURE: "true"
          DETECTION_DASHBOARD_COOKIE_SECURE: "true"
          DEFENSE_DASHBOARD_COOKIE_SECURE: "true"
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.target.juice-shop.yml \
            config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.target.ruby-web.yml \
            config --format json | node -e '
              let text = "";
              process.stdin.on("data", chunk => { text += chunk; });
              process.stdin.on("end", () => {
                const config = JSON.parse(text);
                const services = config.services;
                if (services.policy) throw new Error("separate policy service must not return");
                if (services.detection.environment.TARGET_URL !== "http://defense:8080") {
                  throw new Error("Detection must send requests directly to Defense");
                }
                if (services.defense.environment.BENCHMARK_TARGET_URL !== "http://ruby-web-target:8080") {
                  throw new Error("RUBY web overlay did not select the public web target");
                }
                if (config.networks["ai-defense-net"].name !== "ruby_ai-defense-net") {
                  throw new Error("root and RUBY web stacks do not share the fixed pipeline network");
                }
              });
            '

  python-check:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        service: [defense]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -t ${{ matrix.service }}:ci ./${{ matrix.service }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps for ${{ matrix.service }}
        run: pip install -r ${{ matrix.service }}/requirements.txt

      - name: Import check (문법/의존성 오류 조기 발견)
        working-directory: ${{ matrix.service }}
        run: python -c "import app.main"

      - name: Test ${{ matrix.service }}
        run: python -m unittest discover -s ${{ matrix.service }}/tests -p 'test_*.py'

  integration-check:
    runs-on: ubuntu-26.04
    needs: [detection-check, python-check]
    env:
      DETECTION_DASHBOARD_PASSWORD: integration-password
      DEFENSE_DASHBOARD_PASSWORD: integration-password
      PAYLOAD_FINGERPRINT_KEY: integration-payload-key
      DCID_HMAC_SECRET: integration-dcid-secret
      ACCOUNT_ID_HASH_KEY: integration-account-key
    steps:
      - uses: actions/checkout@v4

      - name: Start Detection, Defense and target
        run: docker compose -f docker-compose.local.yml up -d --build --wait --wait-timeout 180

      - name: Verify public traffic and protected management paths
        run: |
          set -Eeuo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/__detection/api/sessions)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:8081/__detection/telemetry)" = "204"

          curl --fail --silent --show-error -c detection.cookies \
            -H 'Content-Type: application/json' --data '{"password":"integration-password"}' \
            http://127.0.0.1:8081/__detection/api/login >/dev/null
          curl --fail --silent --show-error -b detection.cookies \
            http://127.0.0.1:8081/__detection/api/sessions >/dev/null

          curl --fail --silent --show-error -c defense.cookies \
            -H 'Content-Type: application/json' --data '{"password":"integration-password"}' \
            http://127.0.0.1:8081/__defense/api/login >/dev/null
          curl --fail --silent --show-error -b defense.cookies \
            http://127.0.0.1:8081/__defense/api/snapshot >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8081/ >/dev/null

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yml logs --no-color

      - name: Stop integration stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
