name: Web Defense Benchmark

on:
  push:
    paths:
      - "benchmark/benchmarks/web-defense-benchmark/**"
      - ".github/workflows/web-defense-benchmark.yml"
  pull_request:
    paths:
      - "benchmark/benchmarks/web-defense-benchmark/**"
      - ".github/workflows/web-defense-benchmark.yml"

jobs:
  contracts-and-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: benchmark/benchmarks/web-defense-benchmark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: benchmark/benchmarks/web-defense-benchmark/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Compose configuration
        run: docker compose -f app/compose.yaml config --quiet

      - name: Run contract and application tests
        env:
          PYTHONPATH: app/backend:app/evaluator:app/runner:app/tools
        run: >-
          python -m pytest -q
          tests
          app/backend/tests
          app/evaluator/tests
          app/runner/tests

      - name: Check shell launcher syntax
        run: bash -n scripts/benchmark.sh
