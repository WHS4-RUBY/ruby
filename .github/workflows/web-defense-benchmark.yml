name: Web Defense Benchmark

on:
  push:
    paths:
      - "benchmark/benchmarks/web-defense-benchmark/**"
      - "docker-compose.target.*.yml"
      - ".github/workflows/web-defense-benchmark.yml"
  pull_request:
    paths:
      - "benchmark/benchmarks/web-defense-benchmark/**"
      - "docker-compose.target.*.yml"
      - ".github/workflows/web-defense-benchmark.yml"

jobs:
  contracts-and-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: benchmark/benchmarks/web-defense-benchmark
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: benchmark/benchmarks/web-defense-benchmark/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Compose configuration
        run: |
          docker compose -f app/compose.yaml config --quiet
          docker compose \
            --env-file app/.env.production.example \
            -f app/compose.production.yaml \
            config --quiet

      - name: Validate selectable target overlays
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_PREFIX: ghcr.io/whs4-ruby/ruby
          PAYLOAD_FINGERPRINT_KEY: compose-validation-key
          DCID_HMAC_SECRET: compose-validation-dcid-key
          ACCOUNT_ID_HASH_KEY: compose-validation-account-key
          DETECTION_DASHBOARD_PASSWORD: compose-validation-detection-password
          DEFENSE_DASHBOARD_PASSWORD: compose-validation-defense-password
          DCID_COOKIE_SECURE: "true"
          DETECTION_DASHBOARD_COOKIE_SECURE: "true"
          DEFENSE_DASHBOARD_COOKIE_SECURE: "true"
          RUBY_TARGET_URL: https://site.example.test
          RUBY_TARGET_PROFILE_FILE: ./target-profiles/site.example.json
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.target.juice-shop.yml \
            config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.target.ruby-web.yml \
            config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.target.site.yml \
            config --quiet
          ruby_target=$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.target.ruby-web.yml \
            config --format json | python -c 'import json,sys; print(json.load(sys.stdin)["services"]["defense"]["environment"]["BENCHMARK_TARGET_URL"])')
          test "$ruby_target" = "http://ruby-web-target:8080"

      - name: Run contract and application tests
        env:
          PYTHONPATH: app/backend:app/evaluator:app/runner:app/tools
        run: >-
          python -m pytest -q
          tests
          app/backend/tests
          app/evaluator/tests
          app/runner/tests

      - name: Check shell launcher syntax
        run: |
          bash -n scripts/benchmark.sh
          bash -n scripts/check_target_switch.sh

  runtime-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: benchmark-web-postgres
            context: benchmark/benchmarks/web-defense-benchmark/app/postgres
          - image: benchmark-web-redis
            context: benchmark/benchmarks/web-defense-benchmark/app/redis
          - image: benchmark-web-object-store
            context: benchmark/benchmarks/web-defense-benchmark/app/object-store
          - image: benchmark-web-mock-integration
            context: benchmark/benchmarks/web-defense-benchmark/app/mock-integration
          - image: benchmark-web-api
            context: benchmark/benchmarks/web-defense-benchmark/app/backend
          - image: benchmark-web-evaluator
            context: benchmark/benchmarks/web-defense-benchmark/app/evaluator
          - image: benchmark-web-frontend
            context: benchmark/benchmarks/web-defense-benchmark/app/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image coordinates
        shell: bash
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        shell: bash
        run: >-
          docker build
          --tag "$IMAGE_PREFIX/${{ matrix.image }}:$IMAGE_TAG"
          "${{ matrix.context }}"

      - name: Push immutable runtime image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: docker push "$IMAGE_PREFIX/${{ matrix.image }}:$IMAGE_TAG"
