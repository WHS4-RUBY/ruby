openapi: 3.1.0
info:
  title: RUBY Inline HTTP Defense Adapter
  version: 2.0.0
  description: Synchronous contract for the inline-http attachment profile only.
paths:
  /v2/health:
    get:
      operationId: health
      responses:
        '200':
          description: Adapter readiness and immutable identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v2/decision:
    post:
      operationId: decide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RequestDecisionInput'
                - $ref: '#/components/schemas/ResponseDecisionInput'
      responses:
        '200':
          description: Defense action for exactly one HTTP phase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '422':
          description: Invalid decision input.
  /v2/reset:
    post:
      operationId: reset
      responses:
        '200':
          description: Trial-scoped defense state was reset.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { const: reset }
  /v2/metrics:
    get:
      operationId: metrics
      responses:
        '200':
          description: Trial-scoped defense measurements.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, adapter_id, version, manifest_digest]
      properties:
        status:
          const: ready
        adapter_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,63}$'
        version:
          type: string
          minLength: 1
          maxLength: 64
        manifest_digest:
          $ref: '#/components/schemas/Digest'
    RequestDecisionInput:
      type: object
      additionalProperties: false
      required: [contract_version, trial_id, interaction_id, session_handle, phase, http]
      properties:
        contract_version:
          const: '2.0.0'
        trial_id:
          type: string
          pattern: '^[a-f0-9]{32}$'
        interaction_id:
          type: string
          pattern: '^[a-f0-9]{32}$'
        session_handle:
          type: string
          minLength: 16
          maxLength: 128
        principal_handle:
          type: string
          minLength: 16
          maxLength: 128
        device_handle:
          type: string
          minLength: 16
          maxLength: 128
        phase:
          const: request
        automation_score:
          type: number
          minimum: 0
          maximum: 1
        attack_score:
          type: number
          minimum: 0
          maximum: 1
        http:
          $ref: '#/components/schemas/HttpRequest'
    ResponseDecisionInput:
      type: object
      additionalProperties: false
      required: [contract_version, trial_id, interaction_id, session_handle, phase, http]
      properties:
        contract_version:
          const: '2.0.0'
        trial_id:
          type: string
          pattern: '^[a-f0-9]{32}$'
        interaction_id:
          type: string
          pattern: '^[a-f0-9]{32}$'
        session_handle:
          type: string
          minLength: 16
          maxLength: 128
        principal_handle:
          type: string
          minLength: 16
          maxLength: 128
        device_handle:
          type: string
          minLength: 16
          maxLength: 128
        phase:
          const: response
        automation_score:
          type: number
          minimum: 0
          maximum: 1
        attack_score:
          type: number
          minimum: 0
          maximum: 1
        http:
          $ref: '#/components/schemas/HttpResponse'
    HttpRequest:
      type: object
      additionalProperties: false
      required: [method, scheme, authority, path_and_query, headers, body]
      properties:
        method:
          type: string
          pattern: '^[A-Z]{1,16}$'
        scheme:
          enum: [http, https]
        authority:
          type: string
          minLength: 1
          maxLength: 255
        path_and_query:
          type: string
          pattern: '^/[^\r\n]*$'
          maxLength: 8192
        headers:
          $ref: '#/components/schemas/Headers'
        body:
          $ref: '#/components/schemas/BodyCapture'
    HttpResponse:
      type: object
      additionalProperties: false
      required: [status_code, headers, body]
      properties:
        status_code:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          $ref: '#/components/schemas/Headers'
        body:
          $ref: '#/components/schemas/BodyCapture'
    Headers:
      type: object
      maxProperties: 256
      propertyNames:
        pattern: '^[!#$%&''*+.^_`|~0-9A-Za-z-]+$'
      additionalProperties:
        type: array
        maxItems: 32
        items:
          type: string
          maxLength: 8192
    BodyCapture:
      type: object
      additionalProperties: false
      required: [body_base64, captured_bytes, original_bytes, original_sha256, truncated, truncation_policy_digest]
      properties:
        body_base64:
          type: string
          contentEncoding: base64
          maxLength: 1398104
        captured_bytes:
          type: integer
          minimum: 0
          maximum: 1048576
        original_bytes:
          type: integer
          minimum: 0
        original_sha256:
          $ref: '#/components/schemas/Digest'
        truncated:
          type: boolean
        truncation_policy_digest:
          $ref: '#/components/schemas/Digest'
    DecisionResponse:
      oneOf:
        - $ref: '#/components/schemas/PassDecision'
        - $ref: '#/components/schemas/BlockDecision'
        - $ref: '#/components/schemas/DelayDecision'
        - $ref: '#/components/schemas/RewriteRequestDecision'
        - $ref: '#/components/schemas/ReplaceResponseDecision'
        - $ref: '#/components/schemas/RouteDecoyDecision'
        - $ref: '#/components/schemas/TerminateSessionDecision'
    PassDecision:
      type: object
      additionalProperties: false
      required: [contract_version, action, reason_code]
      properties:
        contract_version: { const: '2.0.0' }
        action: { const: pass }
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
    BlockDecision:
      type: object
      additionalProperties: false
      required: [contract_version, action, reason_code, response]
      properties:
        contract_version: { const: '2.0.0' }
        action: { const: block }
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
        response: { $ref: '#/components/schemas/ResponseReplacement' }
    DelayDecision:
      type: object
      additionalProperties: false
      required: [contract_version, action, reason_code, delay_ms]
      properties:
        contract_version: { const: '2.0.0' }
        action: { const: delay }
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
        delay_ms: { type: integer, minimum: 1, maximum: 60000 }
    RewriteRequestDecision:
      type: object
      additionalProperties: false
      required: [contract_version, action, reason_code, request]
      properties:
        contract_version: { const: '2.0.0' }
        action: { const: rewrite-request }
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
        request: { $ref: '#/components/schemas/RequestReplacement' }
    ReplaceResponseDecision:
      type: object
      additionalProperties: false
      required: [contract_version, action, reason_code, response]
      properties:
        contract_version: { const: '2.0.0' }
        action: { const: replace-response }
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
        response: { $ref: '#/components/schemas/ResponseReplacement' }
    RouteDecoyDecision:
      type: object
      additionalProperties: false
      required: [contract_version, action, reason_code, decoy_target_id]
      properties:
        contract_version: { const: '2.0.0' }
        action: { const: route-decoy }
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
        decoy_target_id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{2,63}$'
    TerminateSessionDecision:
      type: object
      additionalProperties: false
      required: [contract_version, action, reason_code]
      properties:
        contract_version: { const: '2.0.0' }
        action: { const: terminate-session }
        reason_code: { $ref: '#/components/schemas/ReasonCode' }
    RequestReplacement:
      type: object
      additionalProperties: false
      required: [method, scheme, authority, path_and_query, headers, body_base64]
      properties:
        method: { type: string, pattern: '^[A-Z]{1,16}$' }
        scheme: { enum: [http, https] }
        authority: { type: string, minLength: 1, maxLength: 255 }
        path_and_query: { type: string, pattern: '^/[^\r\n]*$', maxLength: 8192 }
        headers: { $ref: '#/components/schemas/Headers' }
        body_base64: { type: string, contentEncoding: base64, maxLength: 1398104 }
    ResponseReplacement:
      type: object
      additionalProperties: false
      required: [status_code, headers, body_base64]
      properties:
        status_code: { type: integer, minimum: 100, maximum: 599 }
        headers: { $ref: '#/components/schemas/Headers' }
        body_base64: { type: string, contentEncoding: base64, maxLength: 1398104 }
    ReasonCode:
      type: string
      pattern: '^[a-z][a-z0-9_.-]{2,127}$'
    Digest:
      type: string
      pattern: '^sha256:[a-f0-9]{64}$'
