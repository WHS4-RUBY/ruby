name: ruby-web-defense-benchmark

services:
  postgres:
    image: ${RUBY_BENCHMARK_IMAGE_PREFIX:?Set RUBY_BENCHMARK_IMAGE_PREFIX}/benchmark-web-postgres:${RUBY_BENCHMARK_IMAGE_TAG:?Set RUBY_BENCHMARK_IMAGE_TAG}
    environment:
      POSTGRES_DB: ruby_web
      POSTGRES_USER: ruby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      POSTGRES_UNTRUSTED_PASSWORD: ${POSTGRES_UNTRUSTED_PASSWORD:?Set POSTGRES_UNTRUSTED_PASSWORD}
      POSTGRES_VERIFIER_PASSWORD: ${POSTGRES_VERIFIER_PASSWORD:?Set POSTGRES_VERIFIER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ruby-postgres-ready && pg_isready -h 127.0.0.1 -U ruby -d ruby_web"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [data, control]

  redis:
    image: ${RUBY_BENCHMARK_IMAGE_PREFIX:?Set RUBY_BENCHMARK_IMAGE_PREFIX}/benchmark-web-redis:${RUBY_BENCHMARK_IMAGE_TAG:?Set RUBY_BENCHMARK_IMAGE_TAG}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  object-store:
    image: ${RUBY_BENCHMARK_IMAGE_PREFIX:?Set RUBY_BENCHMARK_IMAGE_PREFIX}/benchmark-web-object-store:${RUBY_BENCHMARK_IMAGE_TAG:?Set RUBY_BENCHMARK_IMAGE_TAG}
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUBY_WEB_OBJECT_ACCESS_KEY:?Set RUBY_WEB_OBJECT_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUBY_WEB_OBJECT_SECRET_KEY:?Set RUBY_WEB_OBJECT_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - object-data:/data
    restart: unless-stopped
    networks: [data]

  mock-integration:
    image: ${RUBY_BENCHMARK_IMAGE_PREFIX:?Set RUBY_BENCHMARK_IMAGE_PREFIX}/benchmark-web-mock-integration:${RUBY_BENCHMARK_IMAGE_TAG:?Set RUBY_BENCHMARK_IMAGE_TAG}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  api:
    image: ${RUBY_BENCHMARK_IMAGE_PREFIX:?Set RUBY_BENCHMARK_IMAGE_PREFIX}/benchmark-web-api:${RUBY_BENCHMARK_IMAGE_TAG:?Set RUBY_BENCHMARK_IMAGE_TAG}
    environment:
      RUBY_WEB_ENV: production
      RUBY_WEB_DATABASE_URL: postgresql+psycopg://ruby_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/ruby_web
      RUBY_WEB_UNTRUSTED_DATABASE_URL: postgresql+psycopg://ruby_untrusted:${POSTGRES_UNTRUSTED_PASSWORD:?Set POSTGRES_UNTRUSTED_PASSWORD}@postgres:5432/ruby_web
      RUBY_WEB_REDIS_URL: redis://redis:6379/0
      RUBY_WEB_OBJECT_ENDPOINT: object-store:9000
      RUBY_WEB_OBJECT_ACCESS_KEY: ${RUBY_WEB_OBJECT_ACCESS_KEY:?Set RUBY_WEB_OBJECT_ACCESS_KEY}
      RUBY_WEB_OBJECT_SECRET_KEY: ${RUBY_WEB_OBJECT_SECRET_KEY:?Set RUBY_WEB_OBJECT_SECRET_KEY}
      RUBY_WEB_OBJECT_BUCKET: ticket-attachments
      RUBY_WEB_OBJECT_SECURE: "false"
      RUBY_WEB_RESET_TOKEN: ${RUBY_WEB_RESET_TOKEN:?Set RUBY_WEB_RESET_TOKEN}
      RUBY_WEB_TRIAL_ID: ${RUBY_WEB_TRIAL_ID:-}
      RUBY_WEB_VULNERABILITY_MODULES: ${RUBY_WEB_VULNERABILITY_MODULES:-}
      RUBY_WEB_PREPARATION_SEED: ${RUBY_WEB_PREPARATION_SEED:-}
      RUBY_WEB_MOCK_INTEGRATION_ORIGIN: http://mock-integration:8000
      RUBY_WEB_PUBLIC_ORIGIN: ${RUBY_WEB_PUBLIC_ORIGIN:?Set RUBY_WEB_PUBLIC_ORIGIN}
      RUBY_WEB_REPORT_ROOT: /app/benchmark-files
      RUBY_WEB_OPERATIONS_DIAGNOSTIC_KEY: ${RUBY_WEB_OPERATIONS_DIAGNOSTIC_KEY:?Set RUBY_WEB_OPERATIONS_DIAGNOSTIC_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      object-store: {condition: service_healthy}
      mock-integration: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [edge, data]

  worker:
    image: ${RUBY_BENCHMARK_IMAGE_PREFIX:?Set RUBY_BENCHMARK_IMAGE_PREFIX}/benchmark-web-api:${RUBY_BENCHMARK_IMAGE_TAG:?Set RUBY_BENCHMARK_IMAGE_TAG}
    command: ["python", "-m", "ruby_web.worker"]
    environment:
      RUBY_WEB_ENV: production
      RUBY_WEB_DATABASE_URL: postgresql+psycopg://ruby_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/ruby_web
      RUBY_WEB_REDIS_URL: redis://redis:6379/0
      RUBY_WEB_OBJECT_ENDPOINT: object-store:9000
      RUBY_WEB_OBJECT_ACCESS_KEY: ${RUBY_WEB_OBJECT_ACCESS_KEY:?Set RUBY_WEB_OBJECT_ACCESS_KEY}
      RUBY_WEB_OBJECT_SECRET_KEY: ${RUBY_WEB_OBJECT_SECRET_KEY:?Set RUBY_WEB_OBJECT_SECRET_KEY}
      RUBY_WEB_OBJECT_BUCKET: ticket-attachments
      RUBY_WEB_OBJECT_SECURE: "false"
      RUBY_WEB_RESET_TOKEN: ${RUBY_WEB_RESET_TOKEN:?Set RUBY_WEB_RESET_TOKEN}
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    networks: [data]

  evaluator:
    image: ${RUBY_BENCHMARK_IMAGE_PREFIX:?Set RUBY_BENCHMARK_IMAGE_PREFIX}/benchmark-web-evaluator:${RUBY_BENCHMARK_IMAGE_TAG:?Set RUBY_BENCHMARK_IMAGE_TAG}
    environment:
      RUBY_EVALUATOR_DATABASE_URL: postgresql://ruby_verifier:${POSTGRES_VERIFIER_PASSWORD:?Set POSTGRES_VERIFIER_PASSWORD}@postgres:5432/ruby_web
      RUBY_EVALUATOR_TOKEN: ${RUBY_EVALUATOR_TOKEN:?Set RUBY_EVALUATOR_TOKEN}
    depends_on:
      postgres: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [control]

  web:
    image: ${RUBY_BENCHMARK_IMAGE_PREFIX:?Set RUBY_BENCHMARK_IMAGE_PREFIX}/benchmark-web-frontend:${RUBY_BENCHMARK_IMAGE_TAG:?Set RUBY_BENCHMARK_IMAGE_TAG}
    depends_on:
      api: {condition: service_healthy}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      pipeline:
        aliases: [ruby-web-target]
      edge:

networks:
  pipeline:
    external: true
    name: ${RUBY_BENCHMARK_PIPELINE_NETWORK:-ruby_ai-defense-net}
  edge:
    internal: true
  data:
    internal: true
  control:
    internal: true

volumes:
  postgres-data:
  object-data:
