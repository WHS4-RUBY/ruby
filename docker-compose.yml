networks:
  ai-defense-net:

services:
  detection:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/detection:${IMAGE_TAG:-latest}
    container_name: detection
    ports:
      - "80:8081"
      - "127.0.0.1:8088:8080"
    environment:
      - NODE_ENV=production
      - TARGET_URL=http://defense:8080
      - TARGET_CHOICES=${TARGET_CHOICES:-}
      - TARGET_DEFAULT_ID=${TARGET_DEFAULT_ID:-legacy}
      - TARGET_SELECTION_FILE=/app/data/target-selection.json
      - PUBLIC_TARGET_ORIGIN=${PUBLIC_TARGET_ORIGIN:?Set PUBLIC_TARGET_ORIGIN in .env}
      - LEGACY_TARGET_URL=http://host.docker.internal:${TARGET_PORT:-3000}
      - PORT=8081
      - ADMIN_PORT=8080
      - BLOCK_MODE=false
      - DETECTION_LEVEL=${DETECTION_LEVEL:-medium}
      - CSRF_ALLOWED_ORIGINS=${CSRF_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SCHEMA_LEARNING_FILE=/app/data/schema-learning.json
      - CRS_ENABLED=true
      - CRS_MODE=${CRS_MODE:-enforce}
      - CRS_BLOCK_THRESHOLD=${CRS_BLOCK_THRESHOLD:-5}
      - CRS_SCAN_TIMEOUT_MS=2000
      - CRS_MAX_BODY_BYTES=1048576
      - DECEPTION_ENABLED=true
      - DECEPTION_TOKEN_TTL_MS=3600000
      - DECEPTION_MAX_SESSIONS=5000
      - ENABLE_EXPERIMENT_RUN_ID=true
      - PAYLOAD_FINGERPRINT_KEY=${PAYLOAD_FINGERPRINT_KEY:?Set PAYLOAD_FINGERPRINT_KEY}
      - DCID_HMAC_SECRET=${DCID_HMAC_SECRET:?Set DCID_HMAC_SECRET}
      - DCID_TTL_MS=${DCID_TTL_MS:-2592000000}
      - DCID_COOKIE_SECURE=${DCID_COOKIE_SECURE:?Set DCID_COOKIE_SECURE}
      - TRUST_PROXY=${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      - ACCOUNT_JWT_PUBLIC_KEY=${ACCOUNT_JWT_PUBLIC_KEY:-}
      - ACCOUNT_ID_HASH_KEY=${ACCOUNT_ID_HASH_KEY:?Set ACCOUNT_ID_HASH_KEY}
      - DETECTION_DASHBOARD_PASSWORD=${DETECTION_DASHBOARD_PASSWORD:?Set DETECTION_DASHBOARD_PASSWORD}
      - ALLOW_INSECURE_DASHBOARD_HTTP=${ALLOW_INSECURE_DASHBOARD_HTTP:-false}
      - DETECTION_DASHBOARD_COOKIE_SECURE=${DETECTION_DASHBOARD_COOKIE_SECURE:?Set DETECTION_DASHBOARD_COOKIE_SECURE}
      - DETECTION_DASHBOARD_REQUIRE_HTTPS=${DETECTION_DASHBOARD_REQUIRE_HTTPS:-true}
      - DETECTION_DASHBOARD_MAX_SESSIONS=${DETECTION_DASHBOARD_MAX_SESSIONS:-1000}
      - DETECTION_DASHBOARD_LOGIN_ATTEMPTS=${DETECTION_DASHBOARD_LOGIN_ATTEMPTS:-5}
      - DETECTION_DASHBOARD_LOGIN_WINDOW_SECONDS=${DETECTION_DASHBOARD_LOGIN_WINDOW_SECONDS:-300}
      - RESOLVED_ACTOR_TTL_MS=${RESOLVED_ACTOR_TTL_MS:-604800000}
      - MAX_RESOLVED_ACTORS=${MAX_RESOLVED_ACTORS:-5000}
      - MAX_RESOLUTION_MEMBERSHIPS=${MAX_RESOLUTION_MEMBERSHIPS:-20000}
      - MAX_RESOLUTION_RELATED_LINKS=${MAX_RESOLUTION_RELATED_LINKS:-5}
      - FINGERPRINT_SIMILARITY_TTL_MS=${FINGERPRINT_SIMILARITY_TTL_MS:-1800000}
      - FINGERPRINT_CLEANUP_INTERVAL_MS=${FINGERPRINT_CLEANUP_INTERVAL_MS:-60000}
      - FINGERPRINT_MAX_FLOW_CANDIDATES=${FINGERPRINT_MAX_FLOW_CANDIDATES:-3}
      - MAX_CLIENT_FLOWS=${MAX_CLIENT_FLOWS:-5000}
      - FINGERPRINT_IP_ROTATION_ENABLED=${FINGERPRINT_IP_ROTATION_ENABLED:-true}
      - DETECTION_ENTITY_TTL_MS=${DETECTION_ENTITY_TTL_MS:-1800000}
      - RISKY_ENTITY_TTL_MS=${RISKY_ENTITY_TTL_MS:-86400000}
      - DETECTION_ENTITY_SWEEP_MS=${DETECTION_ENTITY_SWEEP_MS:-60000}
      - MAX_SESSIONS=${MAX_SESSIONS:-50000}
      - MAX_ACTORS=${MAX_ACTORS:-50000}
      - MAX_AUTH_GROUPS=${MAX_AUTH_GROUPS:-50000}
      - MAX_IP_ENTRIES=${MAX_IP_ENTRIES:-50000}
      - XSS_MAX_BODY_BYTES=${XSS_MAX_BODY_BYTES:-2000000}
      - XSS_CANDIDATE_TTL_MS=${XSS_CANDIDATE_TTL_MS:-3600000}
      - XSS_MAX_CANDIDATES=${XSS_MAX_CANDIDATES:-2000}
      - XSS_MAX_CANDIDATE_BYTES=${XSS_MAX_CANDIDATE_BYTES:-4194304}
      - XSS_MAX_VALUE_BYTES=${XSS_MAX_VALUE_BYTES:-4096}
    volumes:
      - detection-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      defense:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ai-defense-net

  defense:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/defense:${IMAGE_TAG:-latest}
    container_name: defense
    expose:
      - "8080"
    environment:
      - RUBY_ENV=production
      - TARGET_HOST=host.docker.internal
      - TARGET_PORT=${TARGET_PORT:-3000}
      - TARGET_CHOICES=${TARGET_CHOICES:-}
      - TARGET_DEFAULT_ID=${TARGET_DEFAULT_ID:-legacy}
      - TARGET_SELECTION_FILE=/app/target-data/target-selection.json
      - PATH_ALIAS_MODE=${PATH_ALIAS_MODE:-off}
      - PATH_ALIAS_EPOCH_S=${PATH_ALIAS_EPOCH_S:-1800}
      - PATH_ALIAS_GRACE_EPOCHS=${PATH_ALIAS_GRACE_EPOCHS:-1}
      - PATH_ALIAS_PREFIXES=${PATH_ALIAS_PREFIXES:-/rest/,/api/}
      - PATH_ALIAS_ROUTES_FILE=${PATH_ALIAS_ROUTES_FILE:-/app/config/juice-shop-routes.json}
      - PATH_ALIAS_DB_URL=postgresql://ruby:${PATH_ALIAS_DB_PASSWORD:?Set PATH_ALIAS_DB_PASSWORD}@path-alias-db:5432/ruby
      - PATH_ALIAS_DB_POOL_SIZE=${PATH_ALIAS_DB_POOL_SIZE:-10}
      - PATH_ALIAS_MAX_REWRITE_BYTES=${PATH_ALIAS_MAX_REWRITE_BYTES:-8388608}
      - PATH_ALIAS_APP_ID=${PATH_ALIAS_APP_ID:-}
      - PATH_ALIAS_ROTATE_ON=${PATH_ALIAS_ROTATE_ON:-direct,reject}
      - PATH_ALIAS_COOKIE_SECURE=${PATH_ALIAS_COOKIE_SECURE:-false}
      - DEFENSE_DASHBOARD_ENABLED=${DEFENSE_DASHBOARD_ENABLED:-true}
      - DEFENSE_DASHBOARD_PASSWORD=${DEFENSE_DASHBOARD_PASSWORD:?Set DEFENSE_DASHBOARD_PASSWORD}
      - ALLOW_INSECURE_DASHBOARD_HTTP=${ALLOW_INSECURE_DASHBOARD_HTTP:-false}
      - DEFENSE_DASHBOARD_COOKIE_SECURE=${DEFENSE_DASHBOARD_COOKIE_SECURE:?Set DEFENSE_DASHBOARD_COOKIE_SECURE}
      - DEFENSE_DASHBOARD_REQUIRE_HTTPS=${DEFENSE_DASHBOARD_REQUIRE_HTTPS:-true}
      - DEFENSE_EVENT_LIMIT=${DEFENSE_EVENT_LIMIT:-5000}
      - DEFENSE_DASHBOARD_MAX_SESSIONS=${DEFENSE_DASHBOARD_MAX_SESSIONS:-1000}
      - DEFENSE_DASHBOARD_LOGIN_ATTEMPTS=${DEFENSE_DASHBOARD_LOGIN_ATTEMPTS:-5}
      - DEFENSE_DASHBOARD_LOGIN_WINDOW_SECONDS=${DEFENSE_DASHBOARD_LOGIN_WINDOW_SECONDS:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      path-alias-db:
        condition: service_healthy
    volumes:
      - detection-data:/app/target-data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ai-defense-net

  # Shared alias table for every Defense worker/host. Not published outside the compose network.
  path-alias-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ruby
      - POSTGRES_DB=ruby
      - POSTGRES_PASSWORD=${PATH_ALIAS_DB_PASSWORD:?Set PATH_ALIAS_DB_PASSWORD}
    volumes:
      - path-alias-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ruby", "-d", "ruby"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - ai-defense-net


volumes:
  detection-data:
  path-alias-pg:
