services:
  detection:
    image: ${IMAGE_PREFIX:-local}/detection:${IMAGE_TAG:-latest}
    build: ./detection
    ports:
      - "80:8081"
    environment:
      - NEXT_HOP_URL=http://policy:8082
    depends_on:
      - policy

  policy:
    image: ${IMAGE_PREFIX:-local}/policy:${IMAGE_TAG:-latest}
    build: ./policy
    ports:
      - "8082:8082"
    environment:
      - NEXT_HOP_URL=http://defense:8080
    depends_on:
      - defense

  defense:
    image: ${IMAGE_PREFIX:-local}/defense:${IMAGE_TAG:-latest}
    build: ./defense
    ports:
      - "8080:8080"
    environment:
      - BENCHMARK_TARGET_URL=${BENCHMARK_TARGET_URL:-http://benchmark-target:3000}
    depends_on:
      benchmark-target:
        condition: service_healthy

  benchmark-target:
    profiles:
      - ${BENCHMARK_PROFILE:-disabled}
    image: ${BENCHMARK_IMAGE:?Set BENCHMARK_IMAGE in benchmark/config.env}
    expose:
      - "${BENCHMARK_TARGET_PORT:-3000}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('net').connect({port: process.env.BENCHMARK_TARGET_PORT || 3000,
          host: '127.0.0.1'}).on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    environment:
      - BENCHMARK_TARGET_PORT=${BENCHMARK_TARGET_PORT:-3000}
