networks:
  ai-defense-net:
    external: true

services:
  detection:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/detection:${IMAGE_TAG:-latest}
    ports:
      - "80:8081"
    environment:
      - NEXT_HOP_URL=http://policy:8082
    depends_on:
      - policy
    restart: unless-stopped
    networks:
      - ai-defense-net

  policy:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/policy:${IMAGE_TAG:-latest}
    ports:
      - "8082:8082"
    environment:
      - NEXT_HOP_URL=http://defense:8080
    depends_on:
      - defense
    restart: unless-stopped
    networks:
      - ai-defense-net

  defense:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/defense:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      - BENCHMARK_TARGET_URL=http://benchmark-target:3000
    depends_on:
      benchmark-target:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-defense-net

  benchmark-target:
    image: ${BENCHMARK_IMAGE:-bkimminich/juice-shop:latest}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "require('net').connect({port:3000,host:'127.0.0.1'}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    networks:
      - ai-defense-net
