networks:
  ai-defense-net:

services:
  detection:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/detection:${IMAGE_TAG:-latest}
    container_name: detection
    ports:
      - "80:8081"
      - "127.0.0.1:8088:8080"
    extends:
      file: docker-compose.common.yml
      service: detection-base
    environment:
      - NODE_ENV=production
      - PUBLIC_TARGET_ORIGIN=${PUBLIC_TARGET_ORIGIN:?Set PUBLIC_TARGET_ORIGIN in .env}
      - CSRF_ALLOWED_ORIGINS=${CSRF_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - PAYLOAD_FINGERPRINT_KEY=${PAYLOAD_FINGERPRINT_KEY:?Set PAYLOAD_FINGERPRINT_KEY}
      - DCID_HMAC_SECRET=${DCID_HMAC_SECRET:?Set DCID_HMAC_SECRET}
      - DCID_COOKIE_SECURE=${DCID_COOKIE_SECURE:?Set DCID_COOKIE_SECURE}
      - TRUST_PROXY=${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      - ACCOUNT_ID_HASH_KEY=${ACCOUNT_ID_HASH_KEY:?Set ACCOUNT_ID_HASH_KEY}
      - DETECTION_DASHBOARD_PASSWORD=${DETECTION_DASHBOARD_PASSWORD:?Set DETECTION_DASHBOARD_PASSWORD}
      - ALLOW_INSECURE_DASHBOARD_HTTP=${ALLOW_INSECURE_DASHBOARD_HTTP:-false}
      - DETECTION_DASHBOARD_COOKIE_SECURE=${DETECTION_DASHBOARD_COOKIE_SECURE:?Set DETECTION_DASHBOARD_COOKIE_SECURE}
      - DETECTION_DASHBOARD_REQUIRE_HTTPS=${DETECTION_DASHBOARD_REQUIRE_HTTPS:-true}
    volumes:
      - detection-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      defense:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ai-defense-net

  defense:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/defense:${IMAGE_TAG:-latest}
    container_name: defense
    expose:
      - "8080"
    extends:
      file: docker-compose.common.yml
      service: defense-base
    environment:
      - RUBY_ENV=production
      - DECOY_UPSTREAM_CHOICES=juice-shop=http://cheat-juice:3012,ruby-shop=http://cheat-ruby:3012
      - OVERLAY_UPSTREAM_CHOICES=juice-shop=http://overlay-juice:8080,ruby-shop=http://overlay-ruby:8080
      - OVERLAY_DETECTOR_KEY=${OVERLAY_DETECTOR_KEY:?Set OVERLAY_DETECTOR_KEY}
      - DEFENSE_DASHBOARD_PASSWORD=${DEFENSE_DASHBOARD_PASSWORD:?Set DEFENSE_DASHBOARD_PASSWORD}
      - ALLOW_INSECURE_DASHBOARD_HTTP=${ALLOW_INSECURE_DASHBOARD_HTTP:-false}
      - DEFENSE_DASHBOARD_COOKIE_SECURE=${DEFENSE_DASHBOARD_COOKIE_SECURE:?Set DEFENSE_DASHBOARD_COOKIE_SECURE}
      - DEFENSE_DASHBOARD_REQUIRE_HTTPS=${DEFENSE_DASHBOARD_REQUIRE_HTTPS:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - detection-data:/app/target-data:ro
      - defense-overlay-data:/app/overlay-state
      - defense-alias-data:/app/alias-data
    depends_on:
      cheat-juice:
        condition: service_healthy
      cheat-ruby:
        condition: service_healthy
      overlay-juice:
        condition: service_healthy
      overlay-ruby:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ai-defense-net

  cheat-juice:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/decoy-sidecar:${IMAGE_TAG:-latest}
    environment:
      - REAL_BACKEND=http://juice-shop-target:3000
      - TARGET_PRESET=apache-php
      - DEFENSE_MODE=off
      - DECOY_REQUIRE_PLAN=1
      - CLIENT_ID_FALLBACK=ip
      - DEFENSE_DB=/data/defense.db
      - UVICORN_PROXY_HEADERS=0
    volumes:
      - cheat-juice-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 3012), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-defense-net

  cheat-ruby:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/decoy-sidecar:${IMAGE_TAG:-latest}
    environment:
      - REAL_BACKEND=http://ruby-web-target:8080
      - TARGET_PRESET=nginx-fastapi
      - DEFENSE_MODE=off
      - DECOY_REQUIRE_PLAN=1
      - CLIENT_ID_FALLBACK=ip
      - DEFENSE_DB=/data/defense.db
      - UVICORN_PROXY_HEADERS=0
      - MAZE_EXCLUDE=^/admin(/|$)
    volumes:
      - cheat-ruby-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 3012), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-defense-net

  overlay-juice:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/account-response-overlay:${IMAGE_TAG:-latest}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      - OVERLAY_CONFIG=/app/config/overlay-production-juice-v2.toml
      - OVERLAY_ORIGIN_URL=http://juice-shop-target:3000
      - OVERLAY_DETECTOR_KEY=${OVERLAY_DETECTOR_KEY:?Set OVERLAY_DETECTOR_KEY}
      - DEFENSE_SECRET_FILE=/app/state/session.key
      - DEFENSE_DETECTOR_SECRET_FILE=/app/state/detector.key
      - DEFENSE_SECURITY_DB=/app/state/security.sqlite3
    volumes:
      - overlay-juice-data:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-defense-net

  overlay-ruby:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}/account-response-overlay:${IMAGE_TAG:-latest}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      - OVERLAY_CONFIG=/app/config/overlay-production-ruby-v2.toml
      - OVERLAY_ORIGIN_URL=http://ruby-web-target:8080
      - OVERLAY_DETECTOR_KEY=${OVERLAY_DETECTOR_KEY:?Set OVERLAY_DETECTOR_KEY}
      - DEFENSE_SECRET_FILE=/app/state/session.key
      - DEFENSE_DETECTOR_SECRET_FILE=/app/state/detector.key
      - DEFENSE_SECURITY_DB=/app/state/security.sqlite3
    volumes:
      - overlay-ruby-data:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), 2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ai-defense-net

volumes:
  detection-data:
  cheat-juice-data:
  cheat-ruby-data:
  defense-overlay-data:
  overlay-juice-data:
  overlay-ruby-data:
  defense-alias-data:
