# Dedicated localhost experiment. Every request through agent-gateway is signed as Agent.
name: accounts-response-live-lab
services:
  juice-shop:
    image: bkimminich/juice-shop:v20.2.0
    networks: [lab-private]
    restart: unless-stopped
  init-state:
    image: account-response-overlay:0.13.0
    build:
      context: ..
    entrypoint: [python, -m, defense.live_lab_bootstrap]
    network_mode: none
    volumes:
      - lab-state:/app/state
    restart: "no"
  response-overlay:
    image: account-response-overlay:0.13.0
    build:
      context: ..
    environment:
      OVERLAY_CONFIG: /app/config/overlay-${LIVE_LAB_VERSION:-v2}.toml
      OVERLAY_ORIGIN_URL: http://juice-shop:3000
      DEFENSE_SECRET_FILE: /app/state/session.key
      DEFENSE_DETECTOR_SECRET_FILE: /app/state/detector.key
      DEFENSE_SECURITY_DB: /app/state/security.sqlite3
    depends_on:
      init-state:
        condition: service_completed_successfully
      juice-shop:
        condition: service_started
    volumes:
      - lab-state:/app/state
    networks: [lab-private]
    restart: unless-stopped
  agent-gateway:
    image: account-response-overlay:0.13.0
    build:
      context: ..
    entrypoint: [python, -m, uvicorn, defense.live_lab_gateway:app_factory, --factory,
                 --host, 0.0.0.0, --port, "8080", --workers, "1", --no-proxy-headers,
                 --no-server-header, --ws, none]
    environment:
      LIVE_LAB_OVERLAY_URL: http://response-overlay:8080
      DEFENSE_DETECTOR_SECRET_FILE: /app/state/detector.key
      LIVE_LAB_ACTOR: live-lab-agent
      LIVE_LAB_RISK: ${LIVE_LAB_RISK:-medium}
    depends_on:
      response-overlay:
        condition: service_started
    ports:
      - "127.0.0.1:${LIVE_LAB_PORT:-18080}:8080"
    volumes:
      - lab-state:/app/state:ro
    networks: [lab-private]
    restart: unless-stopped
networks:
  lab-private: {}
volumes:
  lab-state: {}
