# Example profile for a different site. Set overlay site_profile to this file.
login_paths = ["/api/auth/login"]
login_form_selector = "form[data-login]"
recovery_anchor_selector = "a[href='/forgot-password']"
menu_selector = "nav[aria-label='Main']"
account_terms = ["login", "account", "user", "auth", "password"]
recon_segments = ["admin", "internal", "debug", "backup", "config", "private", "secret", ".git", ".env"]
recon_html_paths = ["/admin", "/internal", "/debug", "/backup", "/.git", "/.env"]
api_prefixes = ["/api", "/swagger", "/openapi"]
ordinary_api_prefixes = ["/api/catalog", "/api/search"]
ordinary_api_exact = ["/api/configuration"]
origin_auth_cookies = ["session_token"]
# 미끼가 차지하는 경로 네임스페이스. robots 단서와 로그인 경로 검증의 기준이다.
decoy_namespaces = ["/ftp", "/ops"]
robots_disallow = ["/ftp", "/ops/recovery/accounts", "/ops/service/manifest"]
decoy_brand = "Internal Administration"
decoy_admin_email = "administrator@internal.invalid"
decoy_service = "Internal Account Registry"
decoy_profile_image = ""

# 계정 관련으로 취급할 추가 경로 접두어. 이 셋은 리팩토링 이전에 engagement.py 와
# cycle.py 에 **사이트와 무관하게** 박혀 있었으므로 동작 보존을 위해 그대로 둔다.
# /administration 과 /account 는 웹 전반의 관례지만 /api/Users 는 Juice Shop 경로다 —
# 이 사이트의 실제 계정 경로로 바꾸는 것이 맞고, 근거가 생기면 교체할 항목이다.
account_api_prefixes = ["/api/Users", "/administration", "/account"]
